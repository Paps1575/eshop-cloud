version: '3.4'

services:
  
  catalogdb:
    container_name: catalogdb
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CatalogDb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - catalogdbdata:/var/lib/postgresql/data/

  basketdb:
    container_name: basketdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=BasketDb
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - posgres_basket:/var/lib/postgresql/data/

  mongodb:
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodbdata:/data/db



  catalog.api:
    container_name: catalog.api
    build:
      context: .
      dockerfile: src/Catalog.API/Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=catalogdb;Port=5432;Database=CatalogDb;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      - catalogdb

  redis:
    container_name: redis
    image: redis:7.4
    restart: always
    ports:
      - "6379:6379"

  basket.api:
    container_name: basket.api
    build:
      context: .
      dockerfile: src/Basket/Basket.API/Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=basketdb;Port=5432;Database=BasketDb;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "8082:8080"
    depends_on:
      - basketdb
      - redis

  ordering.api:
    container_name: ordering.api
    build:
      context: .
      dockerfile: src/Ordering/Ordering.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Mongo=mongodb://mongodb:27017
      - Mongo__DatabaseName=OrderingDb
      - Mongo__OrdersCollection=orders
      - Services__BasketUrl=http://basket.api:8080
    ports:
      - "8083:8080"
    depends_on:
      - mongodb
      - basket.api

  ticket.api:
    container_name: ticket.api
    build:
      context: .
      dockerfile: src/Ticket/Ticket.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Services__OrderingUrl=http://ordering.api:8080
    ports:
      - "8084:8080"
    depends_on:
      - ordering.api
